# Force the daemon-reload to run before enable+start (which is in start.yml,
# guarded by argus_stack_start_services). Otherwise a freshly-rendered unit
# isn't yet visible to systemctl when start.yml fires.
- name: systemd — flush handlers (daemon-reload before enable/start)
  ansible.builtin.meta: flush_handlers
