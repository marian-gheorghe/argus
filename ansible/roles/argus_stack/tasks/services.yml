---
# Argus — install systemd --user units from the repo's templates.
#
# The .j2 templates live in <repo>/systemd/. We render them via the template
# module (not copy) so the {{ argus_*_bin }} and Environment values get
# substituted from this role's defaults / group_vars. Each render notifies
# the corresponding daemon's restart handler so a config change actually
# bounces the unit.
#
# Idempotent: ansible's template module diff-renders, so a re-run with no
# change is a no-op (no notify, no restart).

- name: systemd — render clawhip.service unit
  ansible.builtin.template:
    src: "{{ argus_repo_dir }}/systemd/clawhip.service.j2"
    dest: "{{ argus_systemd_user_dir }}/clawhip.service"
    owner: "{{ argus_user }}"
    group: "{{ argus_user }}"
    mode: "0644"
  become: true
  notify:
    - Reload systemd --user
    - Restart clawhip

