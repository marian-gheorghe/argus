---
# Argus — render ~argus/.argus/secrets.env from vaulted variables.
#
# Mirrors what scripts/install-mac.sh expects (sourced by run.sh wrappers
# under launchd). Mode 0600. Atomic via ansible's template module
# (write tmp + rename). no_log on the rendering task so vault values never
# appear in ansible's own log.

- name: Secrets — sanity check vault is loaded
  ansible.builtin.assert:
    that:
      - vault_telegram_bot_token is defined
      - vault_telegram_bot_token != "PLACEHOLDER"
      - vault_clawhip_discord_webhook is defined
    fail_msg: |
      Vault variables are missing or still PLACEHOLDER.
      Did you create + encrypt group_vars/argus_vps.vault.yml from the example?
      Run `ansible-vault encrypt group_vars/argus_vps.vault.yml` after editing.

- name: Secrets — render ~argus/.argus/secrets.env (mode 0600)
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ argus_argus_dir }}/secrets.env"
    owner: "{{ argus_user }}"
    group: "{{ argus_user }}"
    mode: "0600"
  become: true
  no_log: true

# --- GitHub App PEM ------------------------------------------------------
# clawhip's GitHub integration needs a PEM file at a stable path. We render
# the vault value into ~argus/.argus/github-app.pem (mode 0600). If the
# vault entry is the placeholder, we skip the write so first-run is not
# blocked on operators who haven't yet created the GitHub App.
- name: Secrets — render GitHub App private key (when configured)
  ansible.builtin.copy:
    dest: "{{ argus_argus_dir }}/github-app.pem"
    owner: "{{ argus_user }}"
    group: "{{ argus_user }}"
    mode: "0600"
    content: "{{ vault_github_app_pem }}"
  become: true
  when:
    - vault_github_app_pem is defined
    - "'PLACEHOLDER' not in vault_github_app_pem"
  no_log: true
