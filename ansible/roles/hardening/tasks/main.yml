---
# Argus — hardening role. Applies UFW, fail2ban, unattended-upgrades, sysctl
# hardening, and (optionally) disables root SSH login.
#
# Idempotent. UFW rules are matched on (port, source) tuple; sysctl values are
# applied only when they differ from the running value; SSH config edits use
# regexp anchors so re-runs don't append duplicates.

- name: Install hardening packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# --- UFW -----------------------------------------------------------------
- name: UFW — set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny
  become: true

- name: UFW — set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow
  become: true

- name: UFW — allow SSH from operator/tailscale CIDR
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ ufw_ssh_source }}"
    comment: "argus-ssh-tailscale"
  become: true

- name: UFW — allow public ingress (HTTP/HTTPS) for nginx
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "argus-public-{{ item }}"
  loop: "{{ hardening_public_ingress_ports }}"
  become: true

- name: UFW — enable + persist
  community.general.ufw:
    state: enabled
    logging: low
  become: true

# --- fail2ban ------------------------------------------------------------
- name: fail2ban — drop in jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart fail2ban

- name: fail2ban — enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  become: true

# --- unattended-upgrades -------------------------------------------------
- name: unattended-upgrades — write 50unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true

- name: unattended-upgrades — write 20auto-upgrades enabler
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  become: true

# --- sysctl --------------------------------------------------------------
- name: sysctl — drop in 99-argus-hardening.conf
  ansible.builtin.template:
    src: 99-argus-hardening.conf.j2
    dest: /etc/sysctl.d/99-argus-hardening.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: hardening_sysctl_apply
  notify: Reload sysctl

# --- SSH hardening -------------------------------------------------------
- name: sshd — disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart sshd

- name: sshd — disable challenge-response authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?KbdInteractiveAuthentication"
    line: "KbdInteractiveAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart sshd

- name: sshd — disable root login (only after argus_user is provisioned)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  when: hardening_disable_root_ssh
  notify: Restart sshd
