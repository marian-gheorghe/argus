---
- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  become: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  become: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  become: true
  changed_when: false
